<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢字カード</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Klee+One:wght@600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
font-family: 'Klee One', cursive;
font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            color: white;
        }
        
        .header h1 {
            font-size: 2em;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            margin-bottom: 5px;
        }
        
        .menu {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .menu h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        
        .mode-buttons {
            display: grid;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .btn {
            padding: 20px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
            color: white;
        }
        
        .btn-review1 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .btn-review2 {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        
        .btn-list {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
        }

        .btn-round-all {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .order-select {
            margin: 20px 0;
        }
        
        .order-select label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
        }
        
        .order-select select {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-family: inherit;
        }
        
        .card-container {
            display: none;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s;
            position: relative;
        }
        
        .card:hover {
            transform: scale(1.02);
        }
        
        .card-content {
            font-size: 2em;
            line-height: 1.8;
            text-align: center;
            color: #333;
            width: 100%;
        }
        
        .answer {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
        }
        
        .highlight {
            color: #f5576c;
            font-weight: bold;
        }
        
        .flip-hint {
            position: absolute;
            bottom: 20px;
            font-size: 0.9em;
            color: #999;
        }
        
        .progress {
            text-align: center;
            margin: 20px 0;
            font-size: 1.3em;
            color: white;
            font-weight: bold;
        }
        
        .current-rate {
            text-align: center;
            margin: 10px 0;
            font-size: 1.1em;
            color: white;
        }
        
        .answer-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        
        .btn-correct {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 25px;
            font-size: 1.3em;
        }
        
        .btn-incorrect {
            background: linear-gradient(135deg, #ee0979 0%, #ff6a00 100%);
            color: white;
            padding: 25px;
            font-size: 1.3em;
        }
        
        .result {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .result h2 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 30px;
        }
        
        .stats {
            margin: 30px 0;
            font-size: 1.5em;
            color: #333;
        }
        
        .stats div {
            margin: 15px 0;
        }
        
        .config-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px dashed #ccc;
        }
        
        .config-section label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
        }
        
        .config-section input {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-family: inherit;
            margin-bottom: 15px;
        }
        
        .hidden {
            display: none;
        }
        
        .saving-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #38ef7d;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            display: none;
            font-weight: bold;
        }
        
        /* リスト表示用スタイル */
        .list-container {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 20px;
        }
        
        .list-header h2 {
            color: #667eea;
            font-size: 1.8em;
            margin: 0;
        }
        
        .list-back-btn {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: bold;
        }
        
        .list-back-btn:hover {
            background: #5568d3;
        }

        /* 回数入力モーダル */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
        }

        .modal-box h3 {
            color: #667eea;
            font-size: 1.5em;
            margin-bottom: 15px;
        }

        .modal-box p {
            color: #666;
            font-size: 1em;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .modal-box input {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-family: inherit;
            text-align: center;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-cancel {
            background: #ccc;
            color: white;
            padding: 15px;
            font-size: 1.1em;
        }
        
        .question-list {
            display: table;
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95em;
        }
        
        .question-item {
            display: table-row;
            border-bottom: 1px solid #e0e7ff;
            page-break-inside: avoid;
        }
        
        .question-item:last-child {
            border-bottom: none;
        }
        
        .question-item-number {
            display: table-cell;
            padding: 12px 15px;
            color: #999;
            font-weight: bold;
            text-align: center;
            width: 40px;
            background: #f8f9ff;
        }
        
        .question-item-text {
            display: table-cell;
            padding: 12px 15px;
        }
        
        .question-item-content {
            font-size: 1em;
            color: #333;
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .question-item-label {
            font-size: 0.8em;
            color: #999;
            margin-bottom: 3px;
        }
        
        .answer-item-content {
            font-size: 1em;
            color: #667eea;
            font-weight: bold;
        }
        
        .empty-message {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 1.2em;
        }
        
        /* 印刷用スタイル */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            
            .container {
                max-width: 100%;
            }
            
            .list-container {
                box-shadow: none;
                border-radius: 0;
                padding: 10px;
            }
            
            .list-header {
                padding: 0;
                margin-bottom: 15px;
            }
            
            .list-back-btn {
                display: none;
            }
            
            .list-header h2 {
                font-size: 1.5em;
            }
            
            .question-list {
                font-size: 0.9em;
            }
            
            .question-item-number {
                background: white;
                border: 1px solid #ddd;
            }
            
            .question-item-text {
                border: 1px solid #ddd;
            }
            
            .question-item {
                page-break-inside: avoid;
            }
        }

    </style>
</head>
<body>
    <div class="saving-indicator" id="savingIndicator">💾 保存中...</div>
    
    <div class="container">
        <div class="header">
            <h1>✨ 漢字カード ✨</h1>
        </div>
        
        <div class="menu" id="menu">
            <h2>モード選択</h2>
            
            <div class="mode-buttons">
                <button class="btn btn-primary" onclick="startQuiz('normal')">
                    🌟 ふつうモード（最大40問）
                </button>
                <button class="btn btn-review1" onclick="startQuiz('review80')">
                    💪 忘れないぞ復習モード（正答率80%以下）
                </button>
                <button class="btn btn-review2" onclick="startQuiz('review100')">
                    🔥 覚えるぞ復習モード（1回でも間違えたもの）
                </button>
                <button class="btn btn-round-all" onclick="showRoundAllModal()">
                    📚 指定回を全部
                </button>
                <button class="btn btn-list" onclick="showRoundModal()">
                    📊 弱点確認
                </button>
            </div>
            
            <div class="order-select">
                <label>📋 出題順序</label>
                <select id="orderMode">
                    <option value="sequential">順番通り</option>
                    <option value="random">ランダム</option>
                </select>
            </div>
            
            <div class="config-section">
                <label>⚙️ Googleスプレッドシートの設定</label>
                <input type="text" id="sheetUrl" placeholder="スプレッドシートのウェブアプリURLを入力">
                <button class="btn btn-primary" onclick="saveConfig()">設定を保存</button>
            </div>
        </div>
        
        <div class="card-container" id="cardContainer">
            <div class="progress" id="progress"></div>
            <div class="current-rate" id="currentRate"></div>
            <div class="card" id="card" onclick="flipCard()">
                <div class="card-content" id="cardContent"></div>
                <div class="flip-hint">クリックして答えを見る</div>
            </div>
            <div class="answer-buttons hidden" id="answerButtons">
                <button class="btn btn-correct" onclick="answerQuestion(true)">
                    ✅ 書けた！
                </button>
                <button class="btn btn-incorrect" onclick="answerQuestion(false)">
                    ❌ 書けなかった
                </button>
            </div>
        </div>
        
        <div class="result" id="result">
            <h2>🎉 お疲れ様！</h2>
            <div class="stats">
                <div>今日の正解数: <span id="correctCount" style="color: #38ef7d; font-weight: bold;">0</span></div>
                <div>今日の不正解数: <span id="incorrectCount" style="color: #ff6a00; font-weight: bold;">0</span></div>
                <div style="margin-top: 20px; font-size: 0.9em; color: #666;">
                    📊 スプレッドシートに結果を保存しました！
                </div>
            </div>
            <button class="btn btn-primary" onclick="backToMenu()">メニューに戻る</button>
        </div>
        
        <!-- 問題一覧ビュー -->
        <div class="list-container" id="listContainer">
            <div class="list-header">
                <h2 id="listTitle">📊 弱点確認</h2>
                <button class="list-back-btn" onclick="backToMenu()">← メニュー</button>
            </div>
            <div id="questionList">
                <div class="empty-message">読み込み中...</div>
            </div>
        </div>
    </div>

    <!-- 弱点確認：回数入力モーダル -->
    <div class="modal-overlay" id="roundModal" style="display:none;">
        <div class="modal-box">
            <h3>📊 弱点確認</h3>
            <p>表示したい回をカンマ区切りで入力してください。<br>
            例：<strong>3</strong>（第3回のみ）　<strong>1,2,3</strong>（第1・2・3回）</p>
            <input type="text" id="roundInput" placeholder="例: 1,2,3" inputmode="numeric">
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeRoundModal()">キャンセル</button>
                <button class="btn btn-list" onclick="confirmRoundSelection()">表示する</button>
            </div>
        </div>
    </div>

    <!-- 指定回を全部：回数入力モーダル -->
    <div class="modal-overlay" id="roundAllModal" style="display:none;">
        <div class="modal-box">
            <h3>📚 指定回を全部</h3>
            <p>出題したい回をカンマ区切りで入力してください。<br>
            例：<strong>3</strong>（第3回のみ）　<strong>1,2,3</strong>（第1・2・3回）</p>
            <input type="text" id="roundAllInput" placeholder="例: 1,2,3" inputmode="numeric">
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeRoundAllModal()">キャンセル</button>
                <button class="btn btn-round-all" onclick="confirmRoundAllSelection()">出題する</button>
            </div>
        </div>
    </div>

    <script>
        let allQuestions = [];
        let currentQuestions = [];
        let currentIndex = 0;
        let isFlipped = false;
        let sessionCorrect = 0;
        let sessionIncorrect = 0;
        let sheetUrl = 'https://script.google.com/macros/s/AKfycbwtCYAFxLyBVypPE1ehIgcUgq6U0gBP9EXSQ5ruvwgNe1Gi9w9xE3ccjuGFRysRxn6b/exec';
        let updateQueue = [];

        // 初期化
        window.onload = function() {
            loadConfig();
        };

        // 設定の保存
        function saveConfig() {
            const url = document.getElementById('sheetUrl').value.trim();
            if (url) {
                localStorage.setItem('sheetUrl', url);
                sheetUrl = url;
                alert('設定を保存しました！');
                loadQuestions();
            } else {
                alert('URLを入力してください');
            }
        }

        // 設定の読み込み
        function loadConfig() {
            const savedUrl = localStorage.getItem('sheetUrl');
            if (savedUrl) {
                sheetUrl = savedUrl;
                document.getElementById('sheetUrl').value = savedUrl;
            } else {
                document.getElementById('sheetUrl').value = sheetUrl;
            }
            loadQuestions();
        }

        // Googleスプレッドシートから問題を読み込み
        async function loadQuestions() {
            if (!sheetUrl) return;
            
            try {
                const response = await fetch(sheetUrl);
                const data = await response.json();
                allQuestions = data;
                console.log('問題を読み込みました:', allQuestions.length + '問');
            } catch (error) {
                alert('問題の読み込みに失敗しました。URLを確認してください。');
                console.error(error);
            }
        }

        // 弱点確認モーダルを開く
        function showRoundModal() {
            if (allQuestions.length === 0) {
                alert('先にGoogleスプレッドシートのURLを設定してください！');
                return;
            }
            document.getElementById('roundInput').value = '';
            document.getElementById('roundModal').style.display = 'flex';
            setTimeout(() => document.getElementById('roundInput').focus(), 100);
        }

        // 弱点確認モーダルを閉じる
        function closeRoundModal() {
            document.getElementById('roundModal').style.display = 'none';
        }

        // 指定回を全部モーダルを開く
        function showRoundAllModal() {
            if (allQuestions.length === 0) {
                alert('先にGoogleスプレッドシートのURLを設定してください！');
                return;
            }
            document.getElementById('roundAllInput').value = '';
            document.getElementById('roundAllModal').style.display = 'flex';
            setTimeout(() => document.getElementById('roundAllInput').focus(), 100);
        }

        // 指定回を全部モーダルを閉じる
        function closeRoundAllModal() {
            document.getElementById('roundAllModal').style.display = 'none';
        }

        // Enterキー対応
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (document.getElementById('roundModal').style.display === 'flex') {
                    confirmRoundSelection();
                } else if (document.getElementById('roundAllModal').style.display === 'flex') {
                    confirmRoundAllSelection();
                }
            }
        });

        // 弱点確認：回数の入力を確定して一覧表示
        function confirmRoundSelection() {
            const input = document.getElementById('roundInput').value.trim();

            if (!input) {
                alert('回数を入力してください');
                return;
            }

            const parts = input.split(/[,，、]/).map(s => s.trim()).filter(s => s !== '');
            const selectedRounds = parts.map(s => parseInt(s, 10)).filter(n => !isNaN(n));

            if (selectedRounds.length === 0) {
                alert('正しい数字を入力してください（例：1,2,3）');
                return;
            }

            closeRoundModal();
            showListView(selectedRounds);
        }

        // 指定回を全部：回数の入力を確定してクイズ開始
        function confirmRoundAllSelection() {
            const input = document.getElementById('roundAllInput').value.trim();

            if (!input) {
                alert('回数を入力してください');
                return;
            }

            const parts = input.split(/[,，、]/).map(s => s.trim()).filter(s => s !== '');
            const selectedRounds = parts.map(s => parseInt(s, 10)).filter(n => !isNaN(n));

            if (selectedRounds.length === 0) {
                alert('正しい数字を入力してください（例：1,2,3）');
                return;
            }

            closeRoundAllModal();
            startRoundAllQuiz(selectedRounds);
        }

        // 指定回を全部出題
        function startRoundAllQuiz(selectedRounds) {
            const filtered = allQuestions.filter(q => selectedRounds.includes(Number(q.round)));

            if (filtered.length === 0) {
                alert('指定した回の問題が見つかりませんでした。');
                return;
            }

            sessionCorrect = 0;
            sessionIncorrect = 0;
            updateQueue = [];

            currentQuestions = [...filtered];

            const orderMode = document.getElementById('orderMode').value;
            if (orderMode === 'random') {
                currentQuestions = shuffleArray(currentQuestions);
            }

            currentIndex = 0;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('cardContainer').style.display = 'block';
            showQuestion();
        }

        // 問題一覧ビューを表示
        function showListView(selectedRounds) {
            const roundFiltered = allQuestions.filter(q => selectedRounds.includes(Number(q.round)));

            if (roundFiltered.length === 0) {
                document.getElementById('questionList').innerHTML =
                    '<div class="empty-message">指定した回の問題が見つかりませんでした。</div>';
                document.getElementById('menu').style.display = 'none';
                document.getElementById('listContainer').style.display = 'block';
                return;
            }

            const filtered = roundFiltered.filter(q => {
                const rate = q.totalCount > 0 ? (q.correctCount / q.totalCount) * 100 : 0;
                return rate <= 50;
            });

            const sorted = filtered.sort((a, b) => {
                const rateA = a.totalCount > 0 ? (a.correctCount / a.totalCount) * 100 : 0;
                const rateB = b.totalCount > 0 ? (b.correctCount / b.totalCount) * 100 : 0;
                return rateA - rateB;
            });

            const roundLabel = selectedRounds.sort((a,b)=>a-b).map(r => `第${r}回`).join('・');
            document.getElementById('listTitle').textContent = `📊 弱点確認（${roundLabel}）`;

            if (sorted.length === 0) {
                document.getElementById('questionList').innerHTML =
                    `<div class="empty-message">${roundLabel}に正答率50%以下の問題はありません！✨</div>`;
                document.getElementById('menu').style.display = 'none';
                document.getElementById('listContainer').style.display = 'block';
                return;
            }

            const listHTML = sorted.map((q, index) => {
                const highlighted = q.question.replace(/【([^】]+)】/g, '<span class="highlight">【$1】</span>');
                const rate = q.totalCount > 0 ? Math.round((q.correctCount / q.totalCount) * 100) : 0;
                
                return `
                    <tr class="question-item">
                        <td class="question-item-number">${index + 1}</td>
                        <td class="question-item-text">
                            <div class="question-item-content">${highlighted}</div>
                            <div class="question-item-label">第${q.round}回　正答率 ${rate}%（${q.correctCount}/${q.totalCount}）</div>
                        </td>
                        <td class="question-item-text">
                            <div class="answer-item-content">${q.answer}</div>
                        </td>
                    </tr>
                `;
            }).join('');

            const tableHTML = `
                <table class="question-list" style="width:100%; border-collapse:collapse;">
                    <tbody>${listHTML}</tbody>
                </table>
            `;

            document.getElementById('questionList').innerHTML = tableHTML;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('listContainer').style.display = 'block';
        }

        // クイズ開始
        function startQuiz(mode) {
            if (allQuestions.length === 0) {
                alert('先にGoogleスプレッドシートのURLを設定してください！');
                return;
            }

            sessionCorrect = 0;
            sessionIncorrect = 0;
            updateQueue = [];
            
            let filtered = allQuestions;
            if (mode === 'review80') {
                filtered = allQuestions.filter(q => {
                    const rate = q.totalCount > 0 ? (q.correctCount / q.totalCount) * 100 : 0;
                    return rate <= 80;
                });
            } else if (mode === 'review100') {
                filtered = allQuestions.filter(q => {
                    return q.totalCount > q.correctCount;
                });
            }
            
            if (filtered.length === 0) {
                alert('該当する問題がありません！');
                return;
            }
            
            currentQuestions = filtered.slice(0, Math.min(40, filtered.length));
            
            const orderMode = document.getElementById('orderMode').value;
            if (orderMode === 'random') {
                currentQuestions = shuffleArray(currentQuestions);
            }
            
            currentIndex = 0;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('cardContainer').style.display = 'block';
            showQuestion();
        }

        // 配列をシャッフル
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 問題を表示
        function showQuestion() {
            if (currentIndex >= currentQuestions.length) {
                saveToSheet();
                return;
            }
            
            const q = currentQuestions[currentIndex];
            const highlighted = q.question.replace(/【([^】]+)】/g, '<span class="highlight">【$1】</span>');
            const rate = q.totalCount > 0 ? Math.round((q.correctCount / q.totalCount) * 100) : 0;
            
            document.getElementById('progress').textContent = 
                `問題 ${currentIndex + 1} / ${currentQuestions.length}`;
            document.getElementById('currentRate').textContent = 
                `現在の正答率: ${rate}%（${q.correctCount}/${q.totalCount}問正解）`;
            document.getElementById('cardContent').innerHTML = highlighted;
            document.getElementById('answerButtons').classList.add('hidden');
            isFlipped = false;
        }

        // カードをめくる
        function flipCard() {
            if (isFlipped) return;
            
            const q = currentQuestions[currentIndex];
            document.getElementById('cardContent').innerHTML = 
                `<div class="answer">${q.answer}</div>`;
            document.getElementById('answerButtons').classList.remove('hidden');
            isFlipped = true;
        }

        // 回答
        function answerQuestion(correct) {
            const q = currentQuestions[currentIndex];
            
            q.totalCount++;
            if (correct) {
                q.correctCount++;
                sessionCorrect++;
            } else {
                sessionIncorrect++;
            }
            
            updateQueue.push({
                rowIndex: q.rowIndex,
                correctCount: q.correctCount,
                totalCount: q.totalCount
            });
            
            currentIndex++;
            showQuestion();
        }

        // スプレッドシートに保存
        async function saveToSheet() {
            if (updateQueue.length === 0) {
                showResult();
                return;
            }
            
            document.getElementById('savingIndicator').style.display = 'block';
            
            try {
                const response = await fetch(sheetUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updateQueue),
                    mode: 'no-cors'
                });
                
                console.log('スプレッドシートに保存しました');
                setTimeout(() => {
                    document.getElementById('savingIndicator').style.display = 'none';
                    showResult();
                }, 1000);
            } catch (error) {
                console.error('保存エラー:', error);
                document.getElementById('savingIndicator').style.display = 'none';
                showResult();
            }
        }

        // 結果表示
        function showResult() {
            document.getElementById('cardContainer').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            document.getElementById('correctCount').textContent = sessionCorrect;
            document.getElementById('incorrectCount').textContent = sessionIncorrect;
        }

        // メニューに戻る
        function backToMenu() {
            document.getElementById('result').style.display = 'none';
            document.getElementById('listContainer').style.display = 'none';
            document.getElementById('cardContainer').style.display = 'none';
            document.getElementById('menu').style.display = 'block';
            loadQuestions();
        }
    </script>
</body>
</html>
